  "bus-port rejects an index range whose span overflows i64",
  "bus-port still expands an ordinary index range",
]
note = "Negative indices are now rejected (bus-net always did; this restores the parity an earlier cast fix left half-applied) and the span is computed in i128."

[[finding]]
id = "DRIFT-UB-001"
summary = "numeric.checkedInt's INCLUSIVE upper bound compared equal at maxInt for u64/i64/usize and handed an out-of-range value to @intFromFloat — UB in the safety-off production build"
severity = "high"
status = "fixed"
file = ["src/numeric.zig"]
fixed_in = "e2a5f7e"
test = "checkedInt is exact at each type's maximum"
reopens = "JUL-K1"
note = "checkedInt is the one wrapper guardian.toml's [int_from_float] lets a raw @intFromFloat hide inside, so its bound is a safety property of the whole tree. The bound is now the exclusive maxInt(T)+1, which is a power of two and therefore exact in f64 at every width."


