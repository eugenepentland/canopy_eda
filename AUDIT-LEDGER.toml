# Audit finding ledger
#
# WHY THIS FILE EXISTS
#
# This tree has been audited twice: 2026-07-01 (`docs/archive/AUDIT.md`, ~148 findings) and
# 2026-08-29 (a read-only drift audit whose findings are enumerated in commits
# e2a5f7e and 7007d88, merged as 79f63e6). Both remediations were real and both
# were INVISIBLE: nothing in the tree recorded which finding was closed, by
# what, or whether it was still closed.
#
# That cost twice, concretely:
#   1. July's `</script>` breakout (JUL-S4) was fixed in the central writer and
#      CAME BACK through three sibling serializers the fix missed. Nothing
#      noticed the class had reopened until a second full audit found it.
#   2. The second audit had to re-derive the status of every prior finding by
#      hand, at real cost.
#
# `scripts/check_audit_ledger.py` turns "that finding is closed" into something
# a gate can check: every entry marked `fixed` must name a regression test that
# STILL EXISTS in the tree. A fixed finding whose test was deleted or renamed
# has silently lost its guard, and the gate says so by name.
#
# SCOPE (deliberate — this is not a transcription of docs/archive/AUDIT.md)
#
#   IN   every finding from the 2026-08-29 drift audit, fixed and open alike.
#   IN   the July findings whose CLASS is still live or has already reopened —
#        the escaping class (S3-S7), the narrowing class (K1), the pad-number
#        class (K6), the ERC-recursion class (K9) — plus the three Criticals
#        (C1-C3), whose guards are the ones that must never quietly disappear.
#   OUT  the remaining ~120 July findings. The 2026-08-29 audit re-checked the
#        Critical/High set and found them genuinely fixed; the Medium/Low tail
#        is closed, low-value, and transcribing it would bury the live entries
#        under noise. Add an entry here when a class reopens, not before.
#
# SCHEMA (enforced by scripts/check_audit_ledger.py --help)
#
#   id        unique, stable. Never renumber: `reopens` points at these.
#   summary   one line, what actually went wrong.
#   severity  critical | high | medium | low
#   status    fixed | open | waived
#   file      list of paths the finding lived in; each must still exist.
#   fixed_in  commit — required when status = "fixed".
#   test      zig test name(s) proving it; each must exist as `test "<name>"`
#             under src/**/*.zig. Required when status = "fixed", unless
#             `harness` or `untested` stands in for it.
#   harness   a non-zig regression harness, for a fix no zig test can reach:
#             browser JavaScript, or a property of a directory. `path` must
#             exist; `path#anchor` additionally requires `anchor` to still
#             appear as a quoted identifier inside it, so a probe that dropped
#             the named invariant fails instead of passing on file existence.
#             Listed on every run — these are guarded by something the unit
#             suite does not run.
#   untested  true — the escape hatch for a `fixed` finding with NO regression
#             test. Requires `note`. These are counted and listed on every run
#             so the gap stays visible instead of being forgotten.
#   guard     optional non-zig guard (a script path, a Guardian rule name).
#             Path-shaped values are checked for existence. Weaker than
#             `harness`: it does not satisfy the requirement for a `fixed`
#             entry, because existence is all it proves.
#   note      required for `open` and for `untested`.
#   reason    required for `waived`.
#   reopens   optional id of the earlier finding whose class this one reopened.

[meta]
audits = ["2026-07-01", "2026-08-29"]
fix_wave = ["e2a5f7e", "7007d88", "79f63e6"]
sources = ["docs/archive/AUDIT.md", "FEEDBACK.md", "git log"]


# ────────────────────────────────────────────────────────────────────────────
# 2026-08-29 drift audit — security
#
# All four are one bug: a `<script>const PCB=…</script>` blob whose strings come
# from a design. Every PCB page load serialized ref-des, value, MPN, footprint,
# pad and net names through them, so a design-authored `</script>` executed for
# every viewer with no save required. The July fix (JUL-S4) hardened
# json_writer and these three siblings never adopted it.
# ────────────────────────────────────────────────────────────────────────────

[[finding]]
id = "DRIFT-SEC-001"
summary = "pcb_part_json's private escaper covered quotes and control chars but not `<`, so a design string could close the PCB page's script element"
severity = "critical"
status = "fixed"
file = ["src/serve/pcb_part_json.zig"]
fixed_in = "e2a5f7e"
test = "part JSON escapes a closing script tag in every design-derived string"
guard = "guardian-zig script-string-safety"
reopens = "JUL-S4"
note = "The private escaper was deleted rather than patched — the bug class is 'one rule, several spellings'. MPN is editable over HTTP, so this needed no saved design at all."

[[finding]]
id = "DRIFT-SEC-002"
summary = "layer_table_json escaped only `\"` and `\\`, so a plane net name could terminate the blob's script element"
severity = "critical"
status = "fixed"
file = ["src/serve/layer_table_json.zig"]
fixed_in = "e2a5f7e"
test = "a plane net named like a closing script tag cannot terminate the blob's script element"
guard = "guardian-zig script-string-safety"
reopens = "JUL-S4"

[[finding]]
id = "DRIFT-SEC-003"
summary = "power_integrity_json routed design-derived net and terminal names through the plain JSON writer instead of the script-safe one"
severity = "critical"
status = "fixed"
file = ["src/power_integrity_json.zig"]
fixed_in = "e2a5f7e"
test = "power-integrity JSON escapes a closing script tag in every design-derived string"
guard = "guardian-zig script-string-safety"
reopens = "JUL-S4"

[[finding]]
id = "DRIFT-SEC-004"
summary = "buildEditSources spliced ref-des keys and instance labels into the same script blob unescaped — a fourth vector found while fixing the other three"
severity = "high"
status = "fixed"
file = ["src/serve/pcb_part_json.zig"]
fixed_in = "e2a5f7e"
test = "PCB edit-source provenance escapes a closing script tag in ref-des and label"
reopens = "JUL-S4"

[[finding]]
id = "DRIFT-SEC-005"
summary = "the script-string-safety lexical check is pinned green by its own regression tests, so a SECOND private escaper added beside the correct one would pass"
severity = "medium"
status = "waived"
file = [
  "src/serve/pcb_part_json.zig",
  "src/serve/layer_table_json.zig",
  "src/power_integrity_json.zig",
]
reason = "Structural, not fixable in the lexical rule: the check asks per file whether a blob serializer escapes `<` anywhere in its own code, and each fix's regression test asserts on the escaped form — so every one of these files now reads as script-safe no matter what it later gains. Verified by reintroducing exactly that (a hand-rolled escaper with `\"` and `\\` arms and no `<`), which the check passed. Mitigated instead by a guard that READS the file: all three modules carry a self-@embedFile tripwire that fails if the module regains a private quote-escaping switch arm or reaches the plain non-script sink, proven both ways in 7007d88. The check still earns its place — it fires on a blob serializer with no `<` escaping at all, and on a new file added to blob_files. A FOURTH blob serializer must add its own tripwire; that is the residual this waiver records."
guard = "self-@embedFile tripwires in the three modules' script-tag tests"


