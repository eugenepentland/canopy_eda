[[finding]]
id = "JUL-K1"
summary = "unchecked @intFromFloat on design/layout numbers was UB in the shipping safety-off build — a NaN or huge value from a .sexp or a corrupt layouts.json became memory-unsafe UB, not a clean error, across ~8 sites in 5 subsystems"
severity = "high"
status = "fixed"
file = ["src/numeric.zig", "src/eval/design_block.zig", "src/eval/builders.zig", "src/raster.zig"]
fixed_in = "pre-2026-08-29"
test = [
  "checkedInt rejects NaN and infinities",
  "checkedInt rejects out-of-range and rounds in-range",
]
note = "CLASS REOPENED at the boundary: the shared checkedInt guard was correct for NaN, infinity and ordinary out-of-range values, and wrong at exactly maxInt for u64/i64/usize — see DRIFT-UB-001. A guard used tree-wide is worth testing at its edges, not just its middle."

[[finding]]
id = "JUL-K6"
summary = "use-after-scope: bare-integer pad numbers returned a dangling stack slice in the footprint converter, giving garbage pad names in generated library footprints and a broken pad-to-net mapping"
severity = "high"
status = "fixed"
file = ["src/convert/footprint.zig"]
fixed_in = "pre-2026-08-29"
test = "convert bare-int pad numbers do not dangle"
note = "CLASS REOPENED in a different shape: July fixed the LIFETIME of a bare pad token, and left the bare token itself. netlisp's own SI-aware tokenizer then re-read `5V` as 5 on the way back in, dropping the pad from the netlist — see DRIFT-OUT-001 and DRIFT-OUT-002. Same field, same file, adjacent bug."

[[finding]]
id = "JUL-K9"
summary = "half the ERC rules never recursed into sub-blocks (dup-refdes, missing value/footprint, pin-functions, pin-multi-net, voltage-domain), so module internals silently passed checks the top level would fail"
severity = "high"
status = "fixed"
file = ["src/erc.zig"]
fixed_in = "pre-2026-08-29"
test = "duplicate ref-des across a sub-block boundary is flagged"
note = "CLASS REOPENED: the wave that made six ERC checks recurse ADDED the orphaned-verification check in the same change and left it top-level only — see DRIFT-ERC-002. A fix wave is itself a place new instances of the class get introduced."

[[finding]]
id = "JUL-THEME-5"
summary = "cross-cutting: non-atomic writes on state that matters — .layouts.json written on GET with no lock, the auth stores truncate-then-write, insertPendingIds rewriting hand-authored .sexp non-atomically"
severity = "high"
status = "fixed"
file = ["src/infra/fs.zig", "src/infra/atomic_write.zig"]
fixed_in = "pre-2026-08-29"
test = "writeFile replaces the target with exactly the new bytes"
note = "CLASS REOPENED twice. July's recommendation was 'route every state write through the existing atomic-write-with-backup helper' — and guardian.toml went on NAMING an infra/atomic_write.zig that did not exist, while seven design-source, library and notes writes stayed non-atomic (DRIFT-DATA-001) and the layout sidecar had no locking at all (DRIFT-DATA-002). A recommendation is not a fix, and a Guardian idiom that names a nonexistent module guards nothing."
