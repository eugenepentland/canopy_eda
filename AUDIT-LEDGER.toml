harness = "scripts/check_external_gates_armed.sh"
reopens = "DRIFT-INFRA-003"
note = """Found 2026-08-29 while closing DRIFT-INFRA-003, and it is why that finding could not honestly be closed by declaring more externals.

MEASURED, three ways, all on an uncommitted tree so no green-run digest could be hiding it:
 1. Replaced pcb-replay-js-syntax's command with `python3 -c \"import sys; sys.exit(1)\"` — `guardian-check all .` reported 70 checks, 0 blocking.
 2. Broke AUDIT-LEDGER.toml so the ledger checker exits 1 when run by hand (verified) — that file is a declared `input` of the audit-ledger external, so caching cannot apply; `guardian-check all .` still reported 0 blocking, and `zig build --seed=1 test` exited 0.
 3. Appended a syntax error to src/serve/assets/pcb_replay.js — `node --check` fails on it directly; the gate did not.
`guardian-check external-gates .` answers only from its baseline without running anything; `--dry-run` DOES execute the commands (their failure output is visible) but still reports `0 finding(s)`. Config errors DO surface — an `inputs` path that does not exist is reported — so findings flow; command exit status is what is dropped.

PARTIALLY MITIGATED here, not fixed: build.zig's addTreePolicyChecks now hangs the two policy checkers, their two self-tests, and the three JavaScript unit-test runners off the `test` step, and check_js_asset_gates.py --syntax parses all 30 first-party assets plus the 9 further scripts an external names. Verified both ways: a syntax error in pcb_replay.js and a renamed ledger test each fail `zig build test` now, and both rode a green build before. FIXED UPSTREAM 2026-08-30 in guardian-zig 0453ca0, and the root cause was one layer deeper than the symptom. external-gates named each failure as its own UNINDENTED reporter.fail header; baseline.extract collects only INDENTED lines beneath a header and stops at the first hint label, and this check's only indented lines were `stderr:`/`stdout:` — which ARE hint labels. So it reconstructed to zero findings, which against an empty baseline is "matches", which is green. Behind that, runWithBaseline was discarding a check's own CheckFailed verdict in favour of that reconstruction, so ANY check reporting in an unextractable shape would have been disarmed just as silently; baseline.requireNamedFindings now propagates a failure that names nothing. A scan of the other 69 checks found no second instance.

The guard here is scripts/check_external_gates_armed.sh (61ms, wired into build.zig's test step): it builds a throwaway project with a recorded baseline and one gate that exits 1, and requires guardian to exit nonzero AND name the gate. Verified both ways — it fails against the pre-fix guardian binary and passes against the fixed one. The build.zig mitigation above stays as defence in depth, since it does not depend on the toolchain being correct."""

[[finding]]
id = "DRIFT-PERF-001"
summary = "the /systems/:name page shipped with no browser-perf coverage, and its own contract test had been failing unnoticed because Guardian's external gates were inert"
severity = "medium"
status = "fixed"
fixed_in = "82b97e5d"
harness = "scripts/ui_browser_perf/manifest.test.js"
file = ["scripts/ui_browser_perf/manifest.js", "scripts/ui_browser_perf/run.js", "src/serve/system_review_api.zig"]
reopens = "DRIFT-INFRA-004"
note = """Found 2026-08-30 by the DRIFT-INFRA-004 fix, on the very first deploy after it: `ui-browser-perf-route-contract` had been RED and passing. scripts/ui_browser_perf/manifest.test.js requires every non-API GET route in serve.zig to be classified, and /systems/:name — added in 1f33d92, the commit live in production — never was. The contract worked; the gate that ran it did not. This is the first concrete cost of that class, and it is exactly the shape the class predicts: a check that was correct the whole time, attached to a runner that had stopped running.

The interim record was `coverage: "uncovered"` with an account of why — a kind that requires a >=80-char reason and is PRINTED on every passing run, so the gap could not go quiet the way an unclassified route did.

CLOSED by the real surface it asked for. `system_review` exercises /systems/barracuda in the browser matrix: opening an authored document from the list (p95 93 ms), typing into the editor textarea (p95 58 ms), and switching to the largest manifest document, whose ~58 KB of generated HTML replaces the preview and re-walks every [src]/[href] for asset rewriting (p95 146 ms). Measured stable across three independent 3-rep runs; budgets committed at roughly 3-4x headroom.

Release readiness is deliberately outside that surface and is BLOCKED at the harness's request interposer rather than left running in the background. It cannot succeed under the benchmark overlay at all, and the reason is its own finding: DRIFT-SYSREV-001.

The extraction that missed the route in the first place was sound — the bug really was only the inert runner — but it was tightened anyway, because a route this contract cannot READ is indistinguishable from one that does not exist. It now proves the absence of unreadable shapes before reading the readable ones: every `router.get()` path in serve.zig must be a plain string literal, no `all`/`head`/`method`/`group` registration verb may appear, and no other file under src/ may register a route. Verified all three fail against a tree that violates them and pass against one that does not."""

[[finding]]
id = "DRIFT-SYSREV-001"
summary = "system release readiness takes 21-67 s, disagrees with itself across identical requests, and cannot run at all against a project whose lib/ is symlinked"
severity = "medium"
status = "open"
file = ["src/system_review_package.zig", "src/board_review_snapshot.zig", "src/serve/system_review_api.zig"]
note = """Found 2026-08-30 while building the browser-perf surface DRIFT-PERF-001 asked for. Three separate facts, all measured against projects/designs at 23c92b66, none of them previously recorded:

COST. `GET /api/systems/barracuda/readiness` took 21-67 s per call on an idle machine. analyze(.release) computes each board's fab readiness TWICE — once into a throwaway arena as `fab_before`, once for real — plus a board-review snapshot and a verifySnapshot pass, for both boards. The two fab computations alone measured 6.7 s and 13.3 s per board via /api/fab-readiness. The page fires this on boot, so every visit to /systems/:name pays it.

NONDETERMINISM. Roughly half of otherwise identical sequential requests returned 409 `release inputs changed during composition` after ~21 s: the second fab computation disagreed with the first for inputs nobody touched between them. Observed 200/409/409, then 200/200/409/409, on a quiet server with no other client. `netlisp system-check` on the same project succeeded, so this is reachable through the server path specifically — the likeliest cause is a read-only GET refreshing a generated sidecar underneath the composition. The double-compute check is doing its job; what it is catching is our own writes.

CONTAINMENT vs SYMLINKED LIBRARIES. Against the benchmark overlay the same request fails with 422 after ~27 s, `SourceOutsideProject`. board_review_snapshot.zig walks the board's whole .sexp import closure and requires each file to canonicalize INSIDE --project-dir (projectRelativeSource, line 374). The overlay symlinks lib/ to keep the model bundle out of a writable copy, so every imported component and module canonicalizes to the source checkout and is rejected. Reproduced deterministically with `netlisp system-check --project-dir <overlay> barracuda`.

Consequence for the gate: scripts/ui_browser_perf/run.js aborts this request for the system_review surface. Waiting for a guaranteed 27 s error would be a third of the surface's wall clock, and letting it run in the background would leave both boards' fab analyses competing with every interaction being timed. The page renders the failure into #readiness and stays fully usable, which is what the scenarios measure. Covering readiness for real needs the overlay to copy lib/components and lib/modules — cheap, they are text — but that changes the workload every other surface is measured against, so it belongs to a deliberate re-record and not to the change that found it.

UPDATE 2026-09-06 (sprint claude/sprint-0906). Re-examined against current code with a small immutable two-board fixture built from examples/blinky-breakout. The three facts do not share a fate:

CONTAINMENT — one class of it is now FIXED (0d6dcf87). The symlinked-lib/ case was the visible half of a wider rule: appendSource canonicalizes EVERY file the evaluator loaded, and a component resolved from the standard library compiled into the binary has no on-disk path at all, so canonicalPathAlloc returned FileNotFound and aborted the whole composition. A board using any bundled part therefore could not produce a system review — the hermetic stdlib-only usage the open-source examples adopt. Sources under the `netlisp:stdlib/` scheme are now skipped: the closure captures what the PROJECT contributed, and what the TOOL contributed is pinned by the build_id the same snapshot already records. Everything else must still canonicalize inside the project, and a regression test asserts both halves. Measured strict extension: the live 19-design library resolves no board source from the standard library, so nothing that composes today composes differently. The SYMLINKED-lib/ case is untouched and remains open — it is a real out-of-project path, not a binary-supplied one, and admitting it is a separate policy decision.

NONDETERMINISM — did NOT reproduce on the small fixture. Six identical `system-check` runs produced ONE distinct (release_token, content_lock, verdict), and a readiness pass changed no file in the fixture. So the 409s are not inherent to the composition; reproducing them needs the generated sidecars (BOM resolution, DRC caches) these small boards do not have, which is consistent with this entry's own "our own writes" hypothesis. Still open, and still needing a board-scale fixture to pin down.

COST — the double fab computation is still present and code-verified (fab readiness into a throwaway arena, then again for real, per board). At this board size it is 0.18 s per computation, ~13% of a 2.7-3.3 s composition; the 6.7-13.3 s per computation recorded above was measured on far larger boards, where it dominates. Unchanged and still open.

Also fixed on the way in (33dfdde9): a rejected manifest reached every caller as a bare `InvalidManifest` while the validator had already recorded the field, the expectation and the value. `netlisp system-check` now prints them, which is what made the fixture buildable at all."""

[[finding]]
id = "DRIFT-BENCH-001"
summary = "browser-perf servers could auto-commit to the real designs repository: the overlay symlinked .git and no runner disabled NETLISP_GIT_AUTOCOMMIT"
severity = "high"
status = "fixed"
file = ["scripts/ui_browser_perf/run.js", "scripts/pcb_browser_perf/run.js", "scripts/pcb_editor_perf/run.js"]
fixed_in = "5c0d48e1"
harness = "scripts/ui_browser_perf/manifest.test.js#bench-autocommit-disabled"
note = """Found 2026-08-30 by the same investigation as DRIFT-SYSREV-001, one layer below it.

TWO INDEPENDENT HOLES, both required for the hazard and both present. (1) projectOverlay() symlinked every top-level entry of projects/designs it did not special-case, `.git` included. Git resolves the symlink, so the overlay was a work tree of the REAL designs repository that reported the overlay as its toplevel — measured, not inferred: `rev-parse --git-dir` returned `.git` and `--show-toplevel` returned the overlay. (2) All three runners spawned the server with `NETLISP_DEV=1` and left `NETLISP_GIT_AUTOCOMMIT` unset, and config.zig gitAutocommitEnabled() defaults to ENABLED when unset. Production is protected only by its systemd unit (scripts/test_production_toolchain_pin.sh:30), so every benchmark server ran with auto-commit ON. src/serve/system_review_api.zig calls autocommit.begin() at the document-save, attest and asset-upload endpoints, whose `git add -A -- <paths>` + commit would therefore have landed a commit in the user's designs repository, authored from a temporary copy of the tree.

pcb_editor_perf is the sharpest case and was not in the original report: it builds NO overlay at all and serves the real projects/designs directly, so hole (2) was the only thing between a benchmark write and the user's history.

LATENT, NOT FIRED. All 93 `netlisp <netlisp@server>` commits in designs are `mcp:`/`cli:` tool subjects (edit_file, set_part_poses, save_pcb_layout, …), newest 2026-08-22, none reachable from HEAD and none from a review write path. The system_review browser surface (82b97e5d, 2026-08-30) deliberately covers no writes, which is the only reason this never fired — adding the obvious next scenario would have tripped it.

FIX is defence in depth, either half sufficient: every runner now spawns with NETLISP_GIT_AUTOCOMMIT=0, and projectOverlay() skips `.git` the way it skips `lib`, in both runners that build an overlay. Verified by building real overlays from the shipped projectOverlay source: pre-fix the overlay is a git work tree of designs, post-fix `git -C <overlay> rev-parse --git-dir` fails with "not a git repository" for both the ui and the pcb overlay.

GUARDED by two named invariants in scripts/ui_browser_perf/manifest.test.js: `bench-autocommit-disabled` (this entry's anchor — reads EVERY `env: { ...process.env` literal in all three runners, so a newly added spawn that forgets the variable trips it too) and `bench-overlay-not-a-git-repo` (projectOverlay must skip .git and must never symlink it). Six mutants — the env removed from each of the three runners, the .git skip deleted from each of the two overlays, and the symlink resurrected — each fail, and each is caught by the expected guard id. Both siblings were already in the `ui-browser-perf-route-contract` gate's inputs, so a regression in any of the three re-runs the gate.

ONE BEHAVIOUR CHANGE, deliberate: fab_release.captureProjectState() is the only server path that reads `project_dir/.git`, and under an overlay it now degrades to `commit = "unavailable"` instead of reporting the real repository's HEAD and dirty state. That is the more honest answer — the overlay's tree is a copy, and pairing the real repo's commit label with it was itself misleading — and the benchmark aborts that request anyway (DRIFT-SYSREV-001)."""

[[finding]]
id = "DRIFT-SIZE-001"
summary = "src/serve/pcb_layout_page.zig sits at 96% of its hard size ratchet (18,030 lines) and Guardian is asking for a split"
severity = "low"
status = "open"
file = ["src/serve/pcb_layout_page.zig"]
note = """Left as its own change by the fix wave, deliberately. e2a5f7e kept it under the ratchet only by moving a source-scanning test to the sidecar store and extracting the client-revision parse — headroom that is now spent. The next feature-sized edit to this file will fail the ratchet, so the split is due before the next change here, not after.

RE-MEASURED 2026-09-06 (sprint claude/sprint-0906), and left OPEN deliberately — see the last paragraph. The split happened, as its own cohesive extraction rather than a mechanical one: pcb_layout_chrome (2,302), pcb_layout_mcp (4,214), pcb_layout_fab (1,732), pcb_layout_seeds (1,046), pcb_layout_sync (299) and pcb_layout_import (233) now carry what the page used to. src/serve/pcb_layout_page.zig is 8,131 lines, down from the ~17.3k that was 96% of the recorded 18,030-line ratchet — roughly 9k lines of headroom recovered, so the premise of this finding (the next feature-sized edit fails the ratchet) no longer holds. file-size is report-only on every build in this tree and this file has not blocked one. guardian.toml records the same split from the other side, as the sanctioned import-layering exception for those modules.

STILL OPEN, and the reason is the ledger's own rule rather than the file's size. Marking it fixed was tried and correctly refused: scripts/check_audit_ledger_test.py holds the standing claim that every fixed finding names a test or a harness, and this one has neither. The guard against recurrence is Guardian's file-size check, which is REPORT-ONLY in this tree (65 findings on every build, none blocking), so nothing mechanically stops the file regrowing toward the cap. The stated CONDITION is measurably gone; the GUARANTEE is not. Closing this needs one of: file-size made blocking for this path, or a regression test asserting a ceiling for it. Both are deliberate decisions about the gate, and neither was made here."""


