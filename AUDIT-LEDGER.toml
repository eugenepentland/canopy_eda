[[finding]]
id = "DRIFT-DOS-001"
summary = "(bus-port …) checked its 4096-lane cap with an i64 subtraction, so a large-negative start and large-positive end wrapped the span negative, skipped the cap, and ran the expansion loop ~1.8e19 times — reachable over HTTP"
severity = "critical"
status = "fixed"
file = ["src/eval/builders.zig"]
fixed_in = "e2a5f7e"
