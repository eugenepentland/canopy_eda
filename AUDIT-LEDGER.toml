# ────────────────────────────────────────────────────────────────────────────
# 2026-07-01 audit — the three Criticals
#
# Closed, and re-checked clean by the 2026-08-29 audit. They are tracked here
# because they are the highest-severity findings this tree has ever had and
# their guards are exactly the ones that must never quietly disappear.
# ────────────────────────────────────────────────────────────────────────────

[[finding]]
id = "JUL-C1"
summary = "`Host: localhost` header = full unauthenticated admin — 'am I local?' was decided from the client-controlled Host header while the server binds 0.0.0.0, short-circuiting all auth and promoting to admin"
severity = "critical"
status = "fixed"
file = ["src/serve/auth.zig", "src/serve.zig"]
fixed_in = "pre-2026-08-29"
test = [
  "auth-request: a non-loopback peer does not receive the dev bypass",
  "auth-request: dev mode disabled forbids the loopback bypass",
  "auth-request: ipv6 loopback bypasses and a non-loopback ipv6 peer does not",
]
note = "Locality is now derived from the TCP peer address and gated on an explicit dev mode. The three tests cover both halves: peer-derived, and disable-able."

[[finding]]
id = "JUL-C2"
summary = "arbitrary file write to RCE via the X-Filename header — the zip/model upload path templated the unsanitized header into /tmp/netlisp-upload-{s}, and `../../../` escaped /tmp under a systemd --user unit"
severity = "critical"
status = "fixed"
file = ["src/serve/upload.zig", "src/serve/library.zig"]
fixed_in = "pre-2026-08-29"
guard = "src/serve/library.zig isSafeLibName (tested separately)"
test = [
  "the staged-upload path is minted from counters, never from request input",
  "a hostile X-Filename cannot steer a library import",
]
note = "The temp name is minted from a timestamp plus a process-unique atomic counter; both template fields are `{d}`, so no request input can reach the path. The first test pins that structurally (no `{s}` in the template) and behaviourally (the staged path stays one component under /var/tmp). Its real strength is the call itself: `stageArchive` takes the bytes and nothing else, so reintroducing the header means adding a parameter — verified by mutation, that BREAKS THE BUILD at the test's call site rather than failing at runtime. The second test imports one archive twice, under a benign name and a traversal payload, and requires identical results plus an untouched project tree."

[[finding]]
id = "JUL-C3"
summary = "session-token theft via /api/module-source?src=auth/sessions.json — the 'copy source' reader blocked only `..` and a leading `/`, so any reader could read the raw live token store and impersonate admin"
severity = "critical"
status = "fixed"
file = ["src/serve/modules.zig"]
fixed_in = "pre-2026-08-29"
test = "sourceIsSafe rejects markup metacharacters and traversal"


# ────────────────────────────────────────────────────────────────────────────
# 2026-07-01 audit — the escaping class
#
# This is the class that has already reopened once (JUL-S4 → DRIFT-SEC-001..004)
# and the reason this ledger exists. Escaping in this tree is applied by
# convention, not by construction: correct escapers exist and are used ALMOST
# everywhere. Every entry below is a site that bypassed one.
# ────────────────────────────────────────────────────────────────────────────

[[finding]]
id = "JUL-S3"
summary = "the entire SVG emit path wrote net names, ref-des, values and pin labels into markup unescaped — XSS reachable via import-kicad net names, uploaded symbols and MCP write_file"
severity = "high"
status = "fixed"
file = [
  "src/render_svg/draw.zig",
  "src/render_svg/branch.zig",
  "src/render_svg/section_inset.zig",
  "src/render_svg/connection.zig",
]
fixed_in = "pre-2026-08-29"
test = [
  "drawNetWire escapes a quote/angle-bracket in the net name",
  "writeXml neutralizes a script/attribute breakout",
]
note = "The second test guards the canonical escaper the whole class now routes through; the first proves the render_svg sink actually calls it."

[[finding]]
id = "JUL-S4"
summary = "`</script>` breakout in the `<script>const PCB=…</script>` blob — writeJsonStr was a JSON escaper, not a script-context escaper, so a saved-layout, net or ref name containing `</script>` was stored XSS"
severity = "high"
status = "fixed"
file = ["src/json_writer.zig", "src/serve/pcb_layout_page.zig"]
fixed_in = "pre-2026-08-29"
test = "script strings escape closing tags and JavaScript line separators"
note = "REOPENED, and this is the ledger's motivating case. The July fix hardened the central writer; three sibling serializers into the same blob never adopted it and one more vector was never covered at all — see DRIFT-SEC-001 through DRIFT-SEC-004. The central fix was correct and tested the whole time. Nothing checked that its SIBLINGS used it, so the class stayed open for two months with a green suite."

[[finding]]
id = "JUL-S5"
summary = "stored XSS in the schematic BOM card — component, value, MPN, manufacturer and datasheet href rendered with raw {s}, and MPN/manufacturer are attacker-writable via editMpnApi"
severity = "high"
status = "fixed"
file = ["src/serve/bom_html.zig"]
fixed_in = "pre-2026-08-29"
guard = "src/escape.zig writeXml (tested separately)"
test = [
  "the schematic BOM card escapes every field a user can write into it",
  "the BOM card links an http datasheet and leaves a data: URL inert",
]
note = "This was the sharpest gap in the ledger: the fix routes every field through escape.writeXml, the escaper has its own test, and nothing asserted that THIS module still called it — precisely the shape JUL-S4 reopened in. The first test renders a card from a design carrying breakout payloads in component, value, footprint, attrs, property key/value, ref-des, MPN and manufacturer, and asserts on the RENDERED OUTPUT (so it cannot self-blind on its own source text the way a lexical check would): no live markup, and each field present in escaped form so a dropped field cannot pass. MPN and manufacturer are the attribute-context sinks and the two an attacker writes directly via editMpnApi. Verified by mutation: printing MPN with a raw {s} fails it. The second test covers safeHref in both directions so \"no href\" cannot pass by the card having stopped linking datasheets."

[[finding]]
id = "JUL-S6"
summary = "reflected XSS plus arbitrary .sexp/model read in the 3D viewer — the :footprint param was embedded raw in HTML and interpolated into read paths with no name validation"
severity = "high"
status = "fixed"
file = ["src/serve/library_3d.zig"]
fixed_in = "pre-2026-08-29"
guard = "isSafeFootprint at library_3d.zig:41"
test = "isSafeFootprint rejects traversal and markup while accepting real footprint names"
note = "Two vulnerabilities sharing one missing check, and one predicate now closes both: isSafeFootprint gates all five entry points, so a weakened predicate reopens the arbitrary .sexp/model read AND the reflected XSS together. The test drives the decoded forms an attacker actually lands (urlDecode runs first at every call site) across both halves, and pins the accept side too — a comma part number and the `#` KiCad generates — so tightening it into uselessness fails as loudly as loosening it. Verified by mutation: allowing `/`, `<`, `>`, `\"` and dropping the `..` check fails it."

[[finding]]
id = "JUL-S7"
summary = "render_html's title and data-ref, and the scene-graph JSON `name`, were unescaped — an RCDATA/attribute/JSON breakout sitting right next to correctly-escaped siblings"
severity = "high"
status = "fixed"
file = ["src/render_html.zig", "src/render_json.zig"]
fixed_in = "pre-2026-08-29"
test = [
  "serializeScene escapes a quote/backslash in the design name",
  "the schematic page escapes the design name and every hub ref-des it renders",
]
note = "Both halves are covered now. The render_json half has been tested since the July fix; the render_html half was fixed at the same time and went untested for two months, leaving this entry guarding one of two sites. The second test covers all three render_html sinks — the document title and H1 (RCDATA), the subtitle filename, and each hub card's data-ref (an attribute, where a bare quote is a breakout with no angle bracket needed) — plus the URL-encoded sink beside them, where percent-encoding and not escaping is the right answer. Verified by mutation: printing block.name into <title> with a raw {s} fails it."


