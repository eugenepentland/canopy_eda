# ── The three require_in rules ────────────────────────────────────────────
# These name a mirror the project DECIDED to keep and demand it stay in step,
# which is the direction ownership cannot see (a hand-copied branch that quietly
# stops matching). All three were tuned against a measured run on 2026-08-14;
# each note below says what the first draft got wrong, because the mistake is
# the reusable lesson.

# DRC kind display strings, as `drc_json.kindStr` spells them on the wire.
#
# The mirror is the VIEWER's hand-written branch set: `drcMsg`'s per-kind
# tooltips and the `DRC_BLOCK` copper-commit gate. Both fail PERMISSIVELY on a
# rename — an unrecognised kind simply falls through to the generic tooltip and
# stops blocking a commit — which is how the 51bff373 `silk over pad` ->
# `silkscreen overlap` rename left a dead branch that 531 marker tests missed.
#
# NOT `literals_from`, and that is the whole tuning. Extracting `=> "` out of
# drc_json.zig makes the family total over the enum, but the requirement it then
# states is FALSE: pcb_board.js is right not to branch on `annular ring`,
# `pad annular ring`, `min drill`, `component edge`, `perimeter keepout` or
# `sharp RF bend`, because every one of those carries a real measured-vs-floor
# pair and the generic `gap X mm < Y mm` fallback renders it correctly. Mirroring
# them would be padding a lint, not fixing a mirror. (The extraction also swept
# in `err` / `warn` from `sevStr`, two words that occur in every bundled .js in
# the tree, which is what made the ownership direction unusable.)
#
# So the family is exactly the set the viewer must branch on, and the two
# reasons a kind is in it are worth stating: a kind whose gap/clearance pair is
# NOT a shortfall (`copper stub` / `dangling copper` carry 0/0, `single-layer
# via` carries a use COUNT, `copper on own land` an overlap against a miss,
# `length mismatch` an excess) needs its own sentence or the generic form lies;
# and a kind a hand copper edit can dodge by drawing elsewhere belongs in
# DRC_BLOCK. A NEW kind joins this list in the change that gives it a branch.
[[concept]]
name = "drc-kind-strings"
literals = [
  # drcMsg branches — kinds the generic "gap X mm < Y mm" form would misread.
  "net open", "courtyard overlap", "silkscreen overlap",
  "track width", "diff skew", "diff uncoupled", "copper stub",
  "dangling copper", "single-layer via", "copper on own land",
  "length mismatch",
  # DRC_BLOCK — the err-severity kinds a copper edit can dodge, so introducing
  # one rolls the edit back instead of committing it.
  "via↔pad", "via↔via", "via spacing", "via↔track", "track↔track",
  "track↔pad", "pad↔pad", "board edge", "hole↔hole",
]
owner = ["src/serve/drc_json.zig", "src/serve/assets/pcb_board.js"]
require_in = ["src/serve/assets/pcb_board.js"]
# The DRC pipeline's own clients. NOT `assets/*.js`: pcb_settings.js writes
# "Same-net via spacing" and "Minimum track width" as human rule labels in the
# design-rules table, and a lexical rule cannot tell those from a kind test.
files = [
  "src/serve/assets/pcb_board.js", "src/serve/assets/pcb_replay.js",
  "src/serve/assets/drc_marshal.js", "src/serve/assets/drc_worker.js",
]
reason = "DRC kind display strings come from drc_json.kindStr; the viewer's DRC_BLOCK gate and tooltip branches must spell every one (the 51bff373 silk rename went dead silently)"

# `PCB.theme` keys — the names the browser clients read a board colour by.
#
# The mirror is pcb_board.js's TH/PH fallback objects. They are load-bearing
# twice over: they paint a fixture that loads the script with no `PCB` blob at
# all, and they fix the object's shape so every `TH.xxx` read site resolves.
#
# `literals_from` here is TOTAL and stays that way — a colour added to
# board_entries enrols itself and the mirror is asked for it with nobody
# editing this file. That only works because the extraction takes EVERY quoted
# string on a matching line: while `Entry` carried a `.css` field beside the
# key, each row enrolled its `--pcb-…` custom property too, and the rule then
# demanded 23 stylesheet property names of a JS file that has no business
# knowing any of them. board_theme.zig now derives the property from the key
# (see `cssProp`), so a row spells one string and the family is the keys.
#
# require_in ONLY: `files` names the two mirrors, both of which are owners, so
# the ownership scan is deliberately empty. Half these keys are `bg`, `sel`,
# `via`, `drc`, `hole` — three-letter words that occur in every palette in the
# tree (three.min.js has hundreds), so ownership over `assets/*.js` measures
# spelling coincidence and nothing else.
[[concept]]
name = "theme-keys"
literals_from = { file = "src/board_theme.zig", fragments = [".key = \""] }
owner = ["src/board_theme.zig", "src/serve/assets/pcb_board.js", "src/serve/assets/pcb_replay.js"]
require_in = ["src/serve/assets/pcb_board.js"]
files = ["src/serve/assets/pcb_board.js", "src/serve/assets/pcb_replay.js"]
reason = "PCB.theme keys ship from board_theme.board_entries; the JS TH/PH fallback tables must carry every key, both for the no-blob fixture and to keep every TH.xxx read site resolving"

# The cross-probe BroadcastChannel name. Three clients join the channel:
# pcb_board.js, schematic_viewer.js, and thermal_page.js, which is send-only.
# All three are owners and all three are required to spell it: a participant that stops
# matching leaves a window that silently never highlights.
#
# The literal keeps its QUOTES, and schematic_viewer.js was moved to double
# quotes to match the other clients rather than the rule being relaxed to an
# unquoted stem. Dropping the quotes makes the requirement a substring test, and
# a substring test cannot see the rename that actually happens: renaming the
# channel to `netlisp-xprobe-v2` in one window and not the other still contains
# `netlisp-xprobe`, so the rule would pass while the two halves of the bridge sat
# on different channels. With the quotes the spelling must be exact.
[[concept]]
name = "xprobe-protocol"
literals = ["\"netlisp-xprobe\""]
owner = [
  "src/serve/assets/pcb_board.js", "src/serve/assets/schematic_viewer.js",
  "src/serve/assets/thermal_page.js",
]
require_in = [
  "src/serve/assets/pcb_board.js", "src/serve/assets/schematic_viewer.js",
  "src/serve/assets/thermal_page.js",
]
files = ["src/*.zig", "src/serve/assets/*.js"]
reason = "the cross-probe BroadcastChannel name exists only as hand-matched JS literals; all three clients must spell it and nothing else may"

# ── Projections (`[[projection]]`) ───────────────────────────────────────
# A struct whose every field DEFAULTS can be rebuilt out of the parts a caller
# happens to hold — `Copper{ .tracks = rr.tracks, .vias = rr.vias }` — and keeps
# compiling unchanged when the struct grows a field; the omitted field is not
# an error, it is a silent empty. That is how `arcs` (30c8b52c) and `rf_paths`
# reached the connectivity oracle as empty slices from five literals that
# nobody re-read: ten sites were repaired by hand across 60275963 and 04af9ace,
# and the audit of 2026-09-02 found two still wrong (`placement/fine_accept.zig`
# `measure`, `placement/congestion.zig` `measure`) — both frozen below rather
# than fixed here, because a config commit should not carry a behaviour change.
#
# The rule is keyed to the QUALIFIED type path on purpose. This tree holds
# several distinct `Copper` structs (bench_route, mask_relief, drc_match,
# drc_diffpair — two-field types whose complete literal a bare `Copper` rule
# reads as a partial projection), so each rule below names one spelling of the
# one carving bundle. `export_gerber.Copper` is `routed_copper.Copper` under
# another name (export_gerber.zig:144) and gets its own row because the match
# is textual. Anonymous `.{ … }` matching is OFF: `tracks`/`vias` are field
# names of half a dozen unrelated summary structs, and measured on this tree
# the anonymous half reported 98 literals to the typed half's 4. A deliberate
# partial projection says so in the source: `// projection-ok: <why>` on the
# literal, the line above it, or the enclosing statement.
[[projection]]
name = "routed-copper"
type = "routed_copper.Copper"
fields = ["tracks", "vias", "arcs", "rf_paths"]
optional = ["zones", "silk_keepouts"]
anonymous_min_fields = 0
reason = "the connectivity oracle carves every copper kind; a projection that drops one reports a joined net as open"

[[projection]]
name = "routed-copper-gerber-alias"
type = "export_gerber.Copper"
fields = ["tracks", "vias", "arcs", "rf_paths"]
optional = ["zones", "silk_keepouts"]
anonymous_min_fields = 0
reason = "export_gerber.Copper IS routed_copper.Copper; the Gerber and RF exports carve the same bundle the oracle reads"

[[projection]]
name = "pour-copper"
type = "pour.Copper"
fields = ["tracks", "vias", "arcs", "rf_paths"]
optional = ["zones"]
anonymous_min_fields = 0
reason = "a pour carves routed copper of every kind; a projection that drops arcs or RF paths leaves copper unpoured"

# ── Twin drift (`[twin_drift]`) ───────────────────────────────────────────
# Two hand-written copies of one rule that stopped agreeing — the cause behind
# 25 of the 155 fix commits the 2026-09-02 audit read. The live case is
# `buildNetClassOverrides`, copied from wasm_drc.zig into drc_session.zig to stay
# under the file-size cap (its header says so); the wasm copy then gained
# `.class`, `.power_branch_width`, `.keepout_mm` and `.keepout_escape_mm` and
# the session copy did not, so the mid-drag DRC runs with no keepout rule.
#
# Pairing is by BODY (TF-IDF cosine over token shingles, `pair_similarity`),
# then a line-level LCS decides drift (`min_similarity`); identical copies are
# silent (debt, not drift). Measured at adoption: 126 drifted pairs in 0.49 s,
# 70 of them under different names — 24 are one JSON/HTML escaper family under
# nine names in ten files, where only trace_em_json.zig escapes `<`; 37 are the
# six hand-copied serve/*_cache.zig modules. All 126 are frozen in
# .guardian/baselines/twin-drift.txt; a NEW drifted pair blocks. The values
# below are the defaults, spelled out so the knobs are discoverable. `ignore`
# is deliberately empty: `serve`/`deinit`/`trim` look protocol-shaped but every
# pair under them here is a real copy — revisit once the cache modules share one
# implementation.
[twin_drift]
min_statements = 8
pair_similarity = 0.5
min_similarity = 0.6
report_identical = false
max_lines = 400

# The synchronous source transaction capability needs shared process exclusion
# and per-thread nesting. All access lives behind begin/Guard.unlock; a directory
# flock also serializes independent CLI processes. Regression tests exercise it.
[[allow]]
check = "ban-globals"
paths = ["src/infra/source_transaction.zig"]

# Reviewed operation contracts from the September EDA audit. The owners below
# are backed by failure, concurrency, decoding and stale-target regressions.
[[contract]]
name = "layout-durability"
kind = "durable_write"
functions = ["src/layout_sidecar_store.zig::writeLayouts*"]
operations = ["src/layout_sidecar_store.zig::writeFileAll", "src/layout_sidecar_store.zig::writeLayoutsFileJsonRev"]
reason = "Propagate save failures; acknowledge a new revision only after successful persistence."

[[contract]]
name = "layout-read-integrity"
kind = "persistent_read"
functions = ["src/layout_sidecar_store.zig::readSidecarDoc"]
operations = ["*.readFileAlloc", "*.parseFromSliceLeaky"]
reason = "Only FileNotFound is absence; unreadable or malformed saved state must block replacement."

[[contract]]
name = "source-transactions"
kind = "transaction"
functions = ["src/serve/edit.zig::*", "src/serve/notes.zig::*", "src/infra/source_transaction.zig::*"]
operations = ["*.writeFile", "*.createFile", "src/infra/atomic_write.zig::writeFile"]
allow = ["src/infra/source_transaction.zig::writeFile"]
reason = "The source transaction owner requires a held project lock, validates source syntax and commits atomically; adapters hold the lock from read through write."

[[contract]]
name = "typed-edit-requests"
kind = "decoder"
functions = ["src/serve/edit.zig::*", "src/serve/edit_request.zig::*"]
operations = ["*.parseFromSlice", "*.parseFromSliceLeaky"]
allow = ["src/serve/edit_request.zig::decode"]
reason = "One decoder owns edit JSON parsing, escape decoding, duplicate-key rejection and field-type validation."

[[contract]]
name = "instance-target-identity"
kind = "identity"
functions = ["src/serve/edit.zig::findInstanceOpen"]
operations = ["src/serve/edit_target.zig::resolve"]
validators = ["src/serve/edit_target.zig::resolve"]
identity = ["identity"]
revision = ["revision"]
reason = "Semantic review remains visible: resolve checks the exact SHA256 revision and returns only a unique parsed source label. The edit target stale-offset regression tests cover this contract; lexical presence alone cannot prove it."

[[external]]
name = "package-builder-js-syntax"
command = ["node", "--check", "src/serve/assets/package_builder.js"]
inputs = ["src/serve/assets/package_builder.js"]
