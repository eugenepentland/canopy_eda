[[idiom]]
name = "xml-escape-table"
fragments = ["\"&amp;\""]
allow = ["src/escape.zig"]
reason = "hand-rolled XML/HTML entity table - 9 copies with 4 character sets incl. an attribute writer missing the quote; call escape.writeXml"

# The detector's fragment is `.rename(`, which cannot tell a hand-rolled
# tmp+rename WRITE from an honest MOVE. Four private writers were folded into
# `src/infra/atomic_write.zig` on 2026-09-04 (board_backup, library_3d,
# serve/sync's read-only source copy, and kicad_sch_push's two-phase staging);
# the four allowed files are the ones that are not private writers at all:
#   * infra/atomic_write.zig — the shared writer itself.
#   * infra/fs.zig — `Dir.rename`/`Dir.renameTo`, the tree's ONE rename
#     primitive, bound to the `currentIo()` capability. atomic_write is built on
#     it; a second untraced rename path is exactly what this idiom forbids.
#   * serve/vfs.zig — `move_file`, a move rather than a write.
#   * serve/library.zig — the library soft-delete moves
#     `lib/<subdir>/<name>.sexp` into `lib/<subdir>/.deleted/`. It writes no
#     bytes, so there is nothing to stage; routing a move through a writer would
#     mean reading and re-writing the file it is trying not to touch.
[[idiom]]
name = "tmp-rename-write"
fragments = [".rename("]
allow = ["src/infra/atomic_write.zig", "src/infra/fs.zig", "src/serve/library.zig", "src/serve/vfs.zig"]
reason = "private atomic-write (tmp+rename) - one shared writer; a bare move (vfs move_file, library soft-delete) and the fs.zig rename primitive it is built on are not writers"

# ── [[idiom]]: lib-file read caps that diverge from the class limit (DETECTOR)
# `src/lib_limits.zig` OWNS the read cap for netlisp's own `lib/` source files:
# `max_lib_file_bytes = 1 MiB`, one figure across every reader of that class. Its
# own doc comment records the defect a per-reader cap has already caused twice —
# "the same split left two of the pinout readers at 256 KiB while the rest read
# 1 MiB" — and the failure is SILENT: every one of these reads is behind `catch
# return` / `catch return null` / `catch continue`, so an over-cap part goes
# quietly missing from a page/BOM/pin-map instead of erroring.
#
# Two spellings of the stale 256 KiB cap survive, so it takes two rules (an idiom
# is a single-line fragment conjunction and cannot OR two literals). Measured
# 2026-08-29, both FIRING:
#   `1024 * 256` — render_json.zig:146, serve/api.zig:206, eval/ids.zig:685,
#                  serve/bom_html.zig:502 (4 files; all read lib/pinouts or
#                  lib/*.sexp, the exact class lib_limits owns)
#   `1 << 18`    — render_json.zig:191 (1 file; the pinout-name reader)
# Both render_json sites the audit named are covered (146 by the first, 191 by
# the second). The fix is to pass `lib_limits.max_lib_file_bytes` at each site;
# `allow` names lib_limits.zig where the figure legitimately lives. Left FIRING —
# a baseline would hide the divergence.
[[idiom]]
name = "lib-read-cap-256k-mul"
fragments = ["readFileAlloc", "1024 * 256"]
allow = ["src/lib_limits.zig"]
files = ["src/*.zig"]
reason = "lib/ file read capped at a bare 256 KiB instead of lib_limits.max_lib_file_bytes (1 MiB) — an over-cap part is silently swallowed by the catch; pass the class-owned limit"

[[idiom]]
name = "lib-read-cap-256k-shift"
fragments = ["readFileAlloc", "1 << 18"]
allow = ["src/lib_limits.zig"]
files = ["src/*.zig"]
reason = "lib/ file read capped at a bare 1<<18 (256 KiB) instead of lib_limits.max_lib_file_bytes (1 MiB) — an over-cap part is silently swallowed by the catch; pass the class-owned limit"

# ── [[idiom]]: a second private parseOhms implementation (DETECTOR) ────────
# The resistor-value parser `parseOhms` (number + SI/`R`-notation suffix → Ω) is
# `pub` in `src/req_checks.zig`, and `src/req_derived_checks.zig:322` carries a
# byte-for-byte private RE-IMPLEMENTATION of it (same R-notation fold, same
# suffix switch). Two parsers for one value grammar is how a suffix the canonical
# one learns silently goes unrecognised in the derived-checks pass. `allow` names
# the owner; the rule fires on the duplicate definition and NOT on the many legit
# `req_checks.parseOhms(...)` CALL sites (they never spell `fn parseOhms`).
#
# NOTE — why this is an [[idiom]] and NOT a [[concept]] family, per the audit's
# "value/unit parser ownership" item: a concept freezes a LITERAL SPELLING, but
# the parser NAMES are legitimately referenced by every caller (`capFarads` is
# already correctly centralised in decouple_key.zig — every user aliases
# `decouple_key.capFarads`, zero drift — and freezing the name would flag all of
# them). The only real divergence is a duplicate DEFINITION, which the
# definition-spelling fragment `fn parseOhms` catches exactly. Measured
# 2026-08-29: 1 offender (req_derived_checks.zig). Left FIRING.
[[idiom]]
name = "parse-ohms-duplicate"
fragments = ["fn parseOhms"]
allow = ["src/req_checks.zig"]
files = ["src/*.zig"]
reason = "a second private parseOhms re-implements req_checks.parseOhms verbatim — one value grammar, two parsers that can drift; call req_checks.parseOhms instead of forking the suffix logic"

