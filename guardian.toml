# ── The audit ledger ──────────────────────────────────────────────────────
# Two audits have now run over this tree, and the second had to re-derive the
# status of every finding in the first by hand. Worse, the July stored-XSS
# finding (S4) was fixed in the central writer and came BACK through three
# sibling serializers the fix missed — with nothing recording that the class had
# been closed, nothing noticed it had reopened.
#
# `AUDIT-LEDGER.toml` is that record, and this gate is what keeps it honest:
# every entry marked `fixed` names the regression test that proves it, and the
# checker fails if that test no longer exists under src/. A fix whose guard was
# deleted or renamed is not a fix any more. It also prints, on every GREEN run,
# the fixed findings that have no regression test at all — currently 8, three of
# them the browser-editor state bugs — so the gap stays visible instead of
# being rediscovered by the next audit.
#
# `inputs` is the whole Zig tree ON PURPOSE. `inputs` feeds the green-run
# digest, so listing only the ledger would let a .zig-only change reuse a green
# digest and skip this check at exactly the moment it matters: when a test is
# renamed. `src/*.zig` is subtree-matching here (the same spelling the
# [[concept]] rules rely on), so it cannot go stale the way an explicit file
# list would.
[[external]]
name = "audit-ledger"
command = ["python3", "scripts/check_audit_ledger.py"]
inputs = ["AUDIT-LEDGER.toml", "scripts/check_audit_ledger.py", "src/*.zig"]

[[external]]
name = "audit-ledger-selftest"
command = ["python3", "scripts/check_audit_ledger_test.py"]
inputs = ["scripts/check_audit_ledger.py", "scripts/check_audit_ledger_test.py", "AUDIT-LEDGER.toml"]

