allow = [
    "src/eval/net_analysis.zig",
    "src/kicad_sch/stub.zig",
    "src/bench_route.zig",
    "src/query.zig",
    "src/eval/fmt.zig",
    "src/sexpr/printer.zig",
    "src/req_checks.zig",
