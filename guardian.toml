    # contains a dot, and the token is a WIRING address, not a net — the
    # bypass-stub collapse would be the wrong operation here.
    "src/eval/connect.zig",
]
reason = "first-dot bypass-stub collapse - 11 naive copies of the +5.0V->+5 corruption class; the structural fold is kicad_sch/stub.zig, the display collapse is net_analysis.baseNetName"

[[idiom]]
name = "percent-decode-wrapper"
fragments = ["percentDecodeInPlace"]
allow = ["src/serve/urlcodec.zig"]
