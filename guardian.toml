spec_file = "SPEC.md"

# Baseline mode: every check records its current violations into
# .guardian/baselines/<check>.txt on the first build and only fails
# when NEW violations are introduced. This lets us turn on Guardian's
# full 67-check suite without a wall of pre-existing failures.
#
# Workflow:
#   - First build:    baselines are written, all checks pass.
#   - Later builds:   new violations fail; resolved violations auto-prune.
#   - Reviewed drift: zig build guardian-accept -Dguardian-checks=<check>
#                     then inspect and commit the .guardian/ diff.
#
# Baseline files are plain text and sorted, designed to diff cleanly
# in code review.
[baseline]
enabled = true
# A refresh may never grow the spec baseline (fix the debt, or remove "spec" to override).
# "concept" joins them: a concept violation is one row per (file, concept), so
# denying growth means the number of files hand-copying an owned spelling may
# shrink and never grow — the ratchet the [[concept]] block at the bottom of this
# file exists to hold.
#
# The three relational checks join them for the same reason, each keyed so that
# growth means a genuinely new disagreement rather than a moved line:
#   divergent-const   — keyed per NAME, so a third file joining an existing
#                       disagreement lands on the existing row; a NEW const name
#                       holding two values is what fails.
#   twin-referent     — keyed <file>|<referent>, so rewording the sentence around
#                       a claim keeps its key; a new dangling claim fails.
#   duplicate-json-key— keyed <file>|<fn>|<key>; a duplicate key is never
#                       intentional, so this may only ever shrink.
#   projection-completeness — keyed <rule>|<file>|<fn>|<fields set>; a new
#                       partial projection is a new omission, never a moved one.
#   twin-drift        — keyed <nameA>|<fileA>|<nameB>|<fileB>; a new pair is a
#                       copy that newly stopped agreeing, never a re-measurement.
#
# NOTE for whoever declares the next [[concept]] rule: a new rule's own rows are
# themselves growth, and this policy refuses them ("acceptance refused because
# the configured deny_growth policy would grow recorded debt") — the ratchet
# cannot tell a newly-declared rule from a newly-appeared hand-copy. Declaring
# one is therefore a deliberate two-step: drop "concept" here, `guardian-check
# accept concept .`, put it back, and say in the commit what the new rows are.
# That is the intended friction, not a bug to route around.
deny_growth = ["spec", "completeness", "concept", "divergent-const", "twin-referent", "duplicate-json-key",
    "canonical-idiom", "shadowed-const", "import-layering", "twin-parity",
    "projection-completeness", "twin-drift"]

# Commit-tier test suite. Current policy keeps this and every other internal
# Netlisp test self-hosted Debug; ReleaseSafe is built only by deployment.
# This gated on `test-fast` from the 2026-07-23 audit
# until 2026-07-25, when the 1923s figure that justified it was found to be
# STALE: it measured the Debug test binary before the old configuration began
# defaulting the suite to ReleaseSafe. Re-measured on that tree: the FULL
# `zig build test`
# is 9.55s warm (1406 tests) / ~208s cold.
#
# `test-fast` compiles only its 8 hardcoded filters, so it never type-checks the
# rest of the test binary. That is not a theoretical gap — two commits landed
# green here on a suite that would not compile (a call site updated in
# production code but not in its own test). A gate that cannot see a build
# error in a test is not a gate, and ~9s buys the whole suite.
#
# RE-MEASURED 2026-08-04, and the "~9s" above is itself misleading: 9-11s is the
# NO-OP case (nothing changed, everything cached). A commit by definition has
# changes, and after a one-file src edit the full suite costs 4m30s here — the
# ReleaseSafe test binary is re-analyzed, codegen'd and linked before 1930 tests
# run. That is the true per-commit price, and it is being paid knowingly: the
# cheaper tiers all trade away coverage.
#
# Kept at the full suite anyway. `zig build test-compile` (new 2026-08-04,
# guardian's addTestCompileProbe: whole test binary at -fno-emit-bin, nothing
# run) closes exactly the "would not compile" hole above for 10.4s after an edit
# / 1.5s no-op — but it is strictly REDUNDANT inside this gate, because an
# unfiltered `zig build test` already analyzes every test. Making test_command
# `zig build test-compile test-fast` would be ~14s and would stop RUNNING 1930
# tests; test-compile's value is the local dev loop before the gate, not the
# gate. Historical measurement: Zig 0.15.1, -Dtest-opt=ReleaseSafe. The pinned
# Zig 0.17 master suite now defaults to Debug. Final 2026-08-12 measurement:
# 2,538 tests execute in 65.44 s (versus 154.54 s for 2,527 tests on 0.15.1),
# while a fixed-seed unchanged rerun is a 2.62 s cached no-op. The prior 120 s
# wall cap no longer left enough room for measured ~2x cross-session
# contention, so 180 s gives 2.75x headroom while still stopping the old
# 200-second-class regression at the commit that introduces it.
#
# RE-SCOPED 2026-08-17. GUARDIAN_TEST_MAX_WALL_SECS is read by the test RUNNER,
# so since the suite became 8 sharded binaries (each its own runner process) it
# is a PER-SHARD cap, not a cap on the suite. At 180 s that silently became an
# 8x180 s aggregate ceiling — the runaway-cost guard the number was chosen to be
# had been diluted away. 60 s restores it: measured per-shard walls are 8-12 s
# solo and 16-22.1 s under a full-parallel run with all eight shards contending
# (worst of six full runs: 22.06 s), so 60 s keeps ~2.7x headroom over the
# loaded worst case while catching a single-shard runaway an order of magnitude
# sooner than 180 s did.
#
# HISTORY, and the reason to re-read a green gate here with fresh eyes: from
# 2026-08-17 to 2026-08-24 this cap was INERT. Guardian's runner read the
# variable through an 8 KiB FixedBufferAllocator it shared with argv parsing,
# and `std.process.Environ.getAlloc` allocates against the whole environment
# block, so any environment over ~2 KB made the read fail — and `readEnv` mapped
# that failure to `null`, indistinguishable from "unset". Bisected on this tree
# at the time: with `env -i` a 5 s cap correctly failed an 11.05 s shard; add
# ~2 KB of environment and the identical run passed. Every real shell and CI
# environment is well past that, so BOTH 180 and 60 were dead letters.
#
# FIXED UPSTREAM in guardian-zig 3fbcac2 (2026-08-24): `readEnv` now allocates
# from the runner backing allocator and maps only `EnvironmentVariableMissing`
# to null, fataling on OOM/InvalidWtf8 instead of silently disarming. The 60 s
# cap below is therefore LIVE as of the 2026-08-29 audit — it is a real
# per-shard ceiling again, not documentation. Note it remains PER SHARD (the
# runner is one process per shard), so the suite-wide ceiling is 8x this number.
# The `env` prefix is REQUIRED: guardian tokenizes test_command into argv with
# no shell, so a bare NAME=VALUE would be exec'd as the program name.
[gate]
test_command = "env GUARDIAN_TEST_MAX_WALL_SECS=60 zig build --seed=1 test"

# Agent policy profile (same audit): demotes the 8 pure-style checks
# (line-length, boolean-param-ban, magic-number, repeated-string-literal,
# struct-method-cap, optional-density, stringly-typed-switches,
# repeated-switch-on-enum) to report-only. The FEEDBACK.md log shows these —
# line-length ratchet confusion and repeated-switch-on-enum baseline churn
# especially — cost full gate cycles while catching no defects here; every
# correctness/safety/spec check still blocks.
[policy]
profile = "agent"

# ── Layering (`[[boundary]]`) ─────────────────────────────────────────────
# An `@import` is the cheapest way to erode a layer and the hardest thing to
# see in review: nothing in a diff says "this line reaches UP". The two rules
# below name the two upward edges this tree actually has. Baseline mode freezes
# today's sites (`.guardian/baselines/boundaries.txt`) so the count can only
# SHRINK — a new upward import fails the gate naming the rule it broke.
#
# `module` is a `walk.matchGlob` pattern over the walker-relative path; a
# trailing `*` matches the whole subtree. `forbidden` entries are SUBSTRINGS of
# the RESOLVED import path — a relative import is normalized first, so
# `@import("../serve/sync.zig")` inside `src/kicad_pcb/` is compared as
# `src/serve/sync.zig` and matches `serve/`.

# src/kicad_pcb/ is a FILE-FORMAT layer: it parses and emits `.kicad_pcb` and is
# reachable from the CLI with no server in the process. Three sites reach back
# up into the web layer today — reader.zig -> serve/sync.zig,
# import_layout_command.zig -> serve/pcb_layout_import.zig, route_command.zig ->
# serve/drc_rules.zig — each dragging an HTTP-layer module into a format
# module for the sake of a shared type. Frozen, not forgiven: the fix is to
# move the shared type DOWN (under both), not to add a fourth edge.
[[boundary]]
module = "src/kicad_pcb/*"
forbidden = ["serve/"]

# src/placement/ COMPUTES a board; the export layer SERIALIZES one, so the
# dependency belongs the other way round. Today placement reaches up into
# export_kicad.zig (for its pad/track geometry types), export_gerber.zig and
# fab_readiness.zig (the connectivity oracle) across many files. Frozen at
# today's count; the fix is to lift those shared geometry/tally types beneath
# both layers rather than to grow the edge.
[[boundary]]
module = "src/placement/*"
forbidden = ["export_kicad.zig", "export_gerber.zig", "fab_readiness.zig"]

# The local Zig cache is intentionally large for this dependency-heavy design;
# keep doctor advisory below 8 GiB while retaining the tighter Guardian-owned
# cache threshold. Set either value to zero to disable that warning class.
#
# UNCLOSED GAP (measured 2026-08-29): doctor's disk audit inspects only
# `.guardian/cache`, `.zig-cache` and `zig-cache` (guardian-zig
# cli/doctor.zig:inspectCache), and the [doctor] config surface accepts EXACTLY
# these two keys (config_parser.zig whitelists `zig_cache_warn_mib`,
# `guardian_cache_warn_mib` — any third key is a hard parse error). Meanwhile the
# release pipeline leaves ~27 GB of residue in the shared gitdir that no worktree
# or cache threshold sees: `.git/release-candidates` = 18 GB and
# `.git/release-failures` = 9.1 GB here (this worktree shares the main checkout's
# .git). There is no config key to threshold `.git/release-*` growth, so it
# CANNOT be expressed here today — it needs a new doctor key + a gitdir-size
# inspection in guardian-zig (e.g. `release_residue_warn_mib`, scanning
# `git rev-parse --git-common-dir`/release-{candidates,failures}). Filed as a
# guardian-zig gap; not addable from this file.
[doctor]
zig_cache_warn_mib = 8192
guardian_cache_warn_mib = 1024

