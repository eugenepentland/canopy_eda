<style>
/* Stuck-nets dock — one card per net the router could not connect, carrying
   its failure mode, the copper in its way, and the ranked constraint-DSL
   fixes. Mirrors the design-settings drawer's `.ds-*` vocabulary (cards on
   #232428, #303136 hairlines, uppercase 10.5px keys, #8ab8f0 monospace code)
   re-scoped to `.sk-*` so the sidebar owns its own styles — nothing here is
   imported from pcb_settings.css. */
.pcb-stuck{font-size:12px;color:#9b9ca3}
.pcb-stuck .tune-h{font-weight:700;color:#f0f1f3;display:block;margin-bottom:4px}
.sk-count{font-weight:700;color:#e3b341}
.sk-count.ok{color:#69c46f}
#sk-empty{font-size:11px;color:#85868d;line-height:1.45;margin:6px 0 0}
#sk-list{list-style:none;margin:8px 0 0;padding:0;max-height:520px;overflow:auto}
.sk-card{background:#232428;border:1px solid #303136;border-radius:7px;padding:9px 10px;margin-bottom:9px}
.sk-head{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.sk-net{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;font-weight:700;
  color:#8ab8f0;background:none;border:0;padding:0;cursor:pointer;text-align:left;
  overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sk-net:hover{color:#bcd8fa;text-decoration:underline}
/* Failure-mode badges — one colour per mode so a board's failure shape reads
   at a glance (congestion amber, quantization violet, budget blue, escape red). */
.sk-mode{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:9px;border:1px solid #4a4b52;color:#aaaeb7;background:#2a2b30;white-space:nowrap}
.sk-mode-order_congestion{border-color:#9e6a03;color:#e3b341;background:#2a2410}
.sk-mode-blocked_by_higher{border-color:#8a4a3c;color:#e0917f;background:#2a1a16}
.sk-mode-grid_quantization{border-color:#6b4fa8;color:#b69cff;background:#221a33}
.sk-mode-search_budget{border-color:#3f6ba8;color:#8ab8f0;background:#182233}
.sk-mode-escape_blocked{border-color:#a33a2c;color:#f08b7a;background:#2e1512}
.sk-why{font-size:11px;color:#c3c5cb;line-height:1.45;margin:0 0 6px}
.sk-k{display:block;color:#85868d;font-size:10px;text-transform:uppercase;letter-spacing:.045em;margin:7px 0 4px}
.sk-blockers{display:flex;gap:5px;flex-wrap:wrap}
.sk-bl{font:inherit;font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  border:1px solid #3a3b40;background:#2c2d31;color:#d6d7db;border-radius:4px;padding:2px 7px;cursor:pointer}
.sk-bl:hover{border-color:#5a8fd6;color:#f0f1f3}
.sk-bl .sh{color:#e3b341;font-variant-numeric:tabular-nums}
/* Protected (un-rippable) copper — a plane/pour or a higher-priority net the
   router refuses to move. Dimmed + padlocked: no rip-up will free this. */
.sk-bl.sk-locked{opacity:.6;border-style:dashed}
.sk-bl.sk-locked .sh{color:#9b9ca3}
.sk-rem{list-style:none;margin:0;padding:0;counter-reset:skrem}
.sk-rem li{border-top:1px solid #2b2c31;padding:7px 0 2px}
.sk-rem li:first-child{border-top:0;padding-top:2px}
.sk-rem-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.sk-rem-n{counter-increment:skrem;font-size:10px;color:#637287;font-variant-numeric:tabular-nums}
.sk-rem-n:before{content:counter(skrem) "."}
.sk-kind{font-size:10.5px;font-weight:600;color:#e4e5e9}
.sk-target{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:1px 6px;border-radius:8px;border:1px solid #2f6d36;color:#69c46f;background:#152a17}
.sk-target.sk-target-code{border-color:#6b4fa8;color:#b69cff;background:#221a33}
.sk-conf{font-size:9.5px;color:#85868d;margin-left:auto;white-space:nowrap}
.sk-rat{font-size:10.5px;color:#9b9ca3;line-height:1.45;margin:0 0 4px}
.sk-code{display:flex;gap:6px;align-items:flex-start}
.sk-code pre{flex:1;min-width:0;margin:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10.5px;line-height:1.45;color:#8ab8f0;background:#17181b;border:1px solid #2c2d31;
  border-radius:5px;padding:6px 7px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.sk-copy{flex:none;font:inherit;font-size:10px;border:1px solid #3a3b40;background:#2c2d31;
  color:#9b9ca3;border-radius:4px;padding:3px 8px;cursor:pointer}
.sk-copy:hover{border-color:#5a8fd6;color:#f0f1f3}
.sk-copy.done{border-color:#2f6d36;color:#69c46f}
.sk-nodsl{font-size:10.5px;color:#b69cff;line-height:1.4;margin:0}
/* Accordion chip goes amber when the last route left stuck nets. */
.tab-chip.sk-chip-hot{color:#e3b341;border-color:#9e6a03}
</style>
<div class="pcb-stuck pcb-panel" id="panel-stuck" hidden>
  <span class="tune-h">Stuck nets <span class="sk-count" id="sk-count"></span></span>
  <div id="sk-empty">Run <b>Route</b> to see diagnostics &mdash; why each unroutable net failed and what to change.</div>
  <ol id="sk-list"></ol>
</div>
